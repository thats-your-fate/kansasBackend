[package]
name = "future_wells_kansas"
version = "0.1.0"
edition = "2021"

[lib]
name = "future_wells_kansas"
path = "src/lib.rs"

[[bin]]
name = "future_wells_ks_api"
path = "src/bin/future_wells_ks_api.rs"

[[bin]]
name = "ks_ingest"
path = "src/bin/ks_ingest.rs"

[dependencies]
anyhow = "1.0"
axum = "0.7"
calamine = { version = "0.36.1", features = ["dates"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
dotenvy = "0.15"
futures-util = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
scraper = "0.27.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "chrono", "uuid", "migrate", "macros"] }
thiserror = "1.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "signal", "io-util", "fs"] }
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.10", features = ["v4", "serde"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
zstd = "0.13"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
